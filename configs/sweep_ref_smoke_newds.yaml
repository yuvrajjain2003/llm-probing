# P1.1 sizing smoke: one cut point (0.5) on MMLU-Pro, all 3 reference features, BOTH logistic
# grids, run with --max-questions N so runtime/memory can be measured and scaled to the full
# 62k-row run. Output goes to a throwaway _smoke dir, never into ref_fixed.
act_dir: runs/goal2/mmlupro_v1/activations_ckpt/mmlu_pro/DeepSeek-R1-Distill-Qwen-7B
run_dir: runs/goal1/mmlupro_v1/mmlu_pro/DeepSeek-R1-Distill-Qwen-7B
out_dir: runs/goal2/mmlupro_v1/sweep/_smoke
folds: 5
fixed_folds: true
fold_seed: 0
fractions: [0.5]
targets: [answer_entropy_bits_mm, p_mode, rem_len_mean, rem_len_std,
          answer_entropy_bits_mm_norm, committed_by_here]

features:
  act_L21:    {type: act, layers: [21]}
  prefix_len: {type: prefix_len}
  tfidf:      {type: tfidf}

probes:
  ridge_act:     {class: ridge,    grid: {alpha: {logspace: [0, 6, 13]}}}
  ridge_len:     {class: ridge,    grid: {alpha: {logspace: [-6, 3, 10]}}}
  ridge_text:    {class: ridge,    grid: {alpha: {logspace: [-3, 3, 7]}}}
  logistic:      {class: logistic, grid: {C: {logspace: [-4, 1, 6]}}}
  logistic_deep: {class: logistic, grid: {C: {logspace: [-8, 1, 10]}}}

runs:
  - {features: [act_L21],    probes: [ridge_act, logistic, logistic_deep]}
  - {features: [prefix_len], probes: [ridge_len, logistic, logistic_deep]}
  - {features: [tfidf],      probes: [ridge_text, logistic, logistic_deep]}
