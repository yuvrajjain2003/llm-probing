# Step 4c RF FAIR SCORE (generated by runs/sweep_tmp/gen_rfsel.py): min_samples_leaf x max_features picked on inner folds; depth None, 500 trees. Choice justified by 4c_rf_ablation.
act_dir: runs/goal2/gpqa25/activations_ckpt/gpqa_diamond/DeepSeek-R1-Distill-Qwen-7B
run_dir: runs/goal1/gpqa25/gpqa_diamond/DeepSeek-R1-Distill-Qwen-7B
folds: 5
fold_seed: 0
targets: [answer_entropy_bits_mm, rem_len_mean, rem_len_std, p_mode, committed_by_here]
out_dir: runs/goal2/gpqa25/sweep/4c_rf_selected
features:
  act_L21:
    type: act
    layers: [21]
  act_L21_pca16:
    type: act
    layers: [21]
    pca: 16
  act_L21_pca64:
    type: act
    layers: [21]
    pca: 64
  act_L21_pca256:
    type: act
    layers: [21]
    pca: 256
probes:
  rf_sel_raw:
    class: rf
    fixed: &id001 {n_estimators: 500, max_depth: null, n_jobs: 12, seed: 0}
    grid:
      min_samples_leaf: [5, 20]
      max_features: [sqrt, 0.1]
  rf_sel_pca16:
    class: rf
    fixed: *id001
    grid:
      min_samples_leaf: [1, 5, 20]
      max_features: [sqrt, 0.1]
  rf_sel_pca:
    class: rf
    fixed: *id001
    grid:
      min_samples_leaf: [1, 5, 20]
      max_features: [sqrt, 0.1, 0.3]
runs:
- features: [act_L21]
  probes: [rf_sel_raw]
- features: [act_L21_pca16]
  probes: [rf_sel_pca16]
- features: [act_L21_pca64, act_L21_pca256]
  probes: [rf_sel_pca]
