# Step 4c' HGB FAIR SCORE (generated by runs/sweep_tmp/gen_hgbsel.py): max_leaf_nodes x min_samples_leaf picked on inner folds; l2=1, max_features=0.1 fixed (ablation: both ~no effect).
act_dir: runs/goal2/gpqa25/activations_ckpt/gpqa_diamond/DeepSeek-R1-Distill-Qwen-7B
run_dir: runs/goal1/gpqa25/gpqa_diamond/DeepSeek-R1-Distill-Qwen-7B
folds: 5
fold_seed: 0
targets: [answer_entropy_bits_mm, rem_len_mean, rem_len_std, p_mode, committed_by_here]
out_dir: runs/goal2/gpqa25/sweep/4c_hgb_selected
features:
  act_L21:
    type: act
    layers: [21]
  act_L21_pca16:
    type: act
    layers: [21]
    pca: 16
  act_L21_pca64:
    type: act
    layers: [21]
    pca: 64
  act_L21_pca256:
    type: act
    layers: [21]
    pca: 256
probes:
  hgb_sel:
    class: hgb
    fixed: {learning_rate: 0.05, max_iter: 1000, val_frac: 0.15, seed: 0, l2_regularization: 1.0,
      max_features: 0.1}
    grid:
      max_leaf_nodes: [7, 15, 31]
      min_samples_leaf: [20, 100]
runs:
- features: [act_L21, act_L21_pca16, act_L21_pca64, act_L21_pca256]
  probes: [hgb_sel]
