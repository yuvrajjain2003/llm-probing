# Deeper logistic C grid (down to 1e-8) for committed_by_here on globalop_v1 (global_opinions).
# Mirrors configs/sweep_ref_logistic_deep.yaml. Separate out_dir and a distinct probe NAME
# because sweep.py skips combos by (feature, probe name, fraction, target).
act_dir: runs/goal2/globalop_v1/activations_ckpt/global_opinions/DeepSeek-R1-Distill-Qwen-7B
run_dir: runs/goal1/globalop_v1/global_opinions/DeepSeek-R1-Distill-Qwen-7B
out_dir: runs/goal2/globalop_v1/sweep/ref_logistic_deep
folds: 5
fixed_folds: true
fold_seed: 0
fractions: [0.1, 0.3, 0.5, 0.7, 0.9]
targets: [committed_by_here]

features:
  act_L21:    {type: act, layers: [21]}
  prefix_len: {type: prefix_len}
  tfidf:      {type: tfidf}

probes:
  logistic_deep: {class: logistic, grid: {C: {logspace: [-8, 1, 10]}}}

runs:
  - {features: [act_L21, prefix_len, tfidf], probes: [logistic_deep]}
