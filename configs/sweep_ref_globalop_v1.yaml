# Reference sweep on FIXED per-question folds for globalop_v1 (global_opinions): ridge/logistic on act_L21,
# prefix_len, tfidf. Mirrors configs/sweep_ref.yaml (the GPQA reference) exactly: same grids,
# same feature and probe names, same folds/seed, so numbers are directly comparable.
# Targets are set explicitly: the 5 the P1 brief asks for, plus answer_entropy_bits_mm_norm
# (n_options varies here, so the normalised entropy is reported alongside; same NaN mask as
# answer_entropy_bits_mm, so it costs no extra unit). will_commit is NOT run (not in the brief).
act_dir: runs/goal2/globalop_v1/activations_ckpt/global_opinions/DeepSeek-R1-Distill-Qwen-7B
run_dir: runs/goal1/globalop_v1/global_opinions/DeepSeek-R1-Distill-Qwen-7B
out_dir: runs/goal2/globalop_v1/sweep/ref_fixed
folds: 5
fixed_folds: true
fold_seed: 0
fractions: [0.1, 0.3, 0.5, 0.7, 0.9]
targets: [answer_entropy_bits_mm, p_mode, rem_len_mean, rem_len_std,
          answer_entropy_bits_mm_norm, committed_by_here]

features:
  act_L21:    {type: act, layers: [21]}
  prefix_len: {type: prefix_len}
  tfidf:      {type: tfidf}

probes:
  ridge_act:     {class: ridge,    grid: {alpha: {logspace: [0, 6, 13]}}}
  ridge_len:     {class: ridge,    grid: {alpha: {logspace: [-6, 3, 10]}}}
  ridge_text:    {class: ridge,    grid: {alpha: {logspace: [-3, 3, 7]}}}
  logistic:      {class: logistic, grid: {C: {logspace: [-4, 1, 6]}}}

runs:
  - {features: [act_L21],    probes: [ridge_act, logistic]}
  - {features: [prefix_len], probes: [ridge_len, logistic]}
  - {features: [tfidf],      probes: [ridge_text, logistic]}
